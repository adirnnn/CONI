services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coni
      POSTGRES_PASSWORD: coni_local_only
      POSTGRES_DB: coni
    ports:
      - "54360:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coni"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
